    <style>
        :root {
            --neon: #faff00;
            --bg: #000;
            --card-bg: #0a0a0a;
            --border: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* ==================== NAVBAR ==================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5%;
            border-bottom: 2px solid var(--neon);
            background: rgba(0,0,0,0.98);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--neon);
            object-fit: cover;
            box-shadow: 0 0 15px rgba(250, 255, 0, 0.3);
        }

        .brand-name {
            font-size: 22px;
            font-weight: bold;
            color: var(--neon);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(250, 255, 0, 0.5);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            background: var(--neon);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .social-btn:hover {
            transform: scale(1.2) rotate(15deg);
            box-shadow: 0 0 15px var(--neon);
        }

        /* ==================== HERO VIDEO ==================== */
        .hero-video {
            width: 100%;
            height: 50vh;
            position: relative;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ==================== FILTER SIDEBAR ==================== */
        .filter-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
        }

        .filter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
            position: relative;
        }

        .filter-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .filter-toggle {
            width: 50px;
            height: 50px;
            background: transparent;
            border: 2px solid var(--neon);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--neon);
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .filter-toggle:hover {
            background: var(--neon);
            color: #000;
            transform: rotate(90deg);
        }

        .category-label {
            font-size: 16px;
            color: var(--neon);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-title-wrapper {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title {
            font-family: 'Anton', sans-serif;
            font-size: 56px;
            color: var(--neon);
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(250, 255, 0, 0.5);
            animation: titleJump 4s ease-in-out infinite;
        }

        @keyframes titleJump {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .shopping-icon {
            font-size: 42px;
            color: var(--neon);
            animation: iconBounce 4s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(10deg); }
        }

        @media (max-width: 768px) {
            .filter-header {
                gap: 10px;
                margin-bottom: 20px;
                flex-direction: column;
                align-items: flex-start;
            }
            .filter-left { gap: 10px; }
            .category-label { font-size: 12px; letter-spacing: 0.5px; }
            .section-title-wrapper {
                position: relative;
                left: 0;
                transform: none;
                width: 100%;
                justify-content: center;
                margin-top: 15px;
            }
            .section-title { font-size: 28px; letter-spacing: 4px; }
            .shopping-icon { font-size: 24px; }
        }

        .sidebar {
            position: fixed;
            left: -320px;
            top: 0;
            width: 320px;
            height: 100vh;
            background: linear-gradient(180deg, rgba(0,0,0,0.98) 0%, rgba(10,10,10,0.98) 100%);
            border-right: 3px solid var(--neon);
            z-index: 2000;
            transition: left 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            padding-top: 100px;
            overflow-y: auto;
            box-shadow: 5px 0 30px rgba(250, 255, 0, 0.1);
        }

        .sidebar.open { left: 0; }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1500;
            display: none;
            backdrop-filter: blur(5px);
        }

        .sidebar-overlay.show { display: block; }

        .sidebar-header {
            padding: 0 25px 20px;
            border-bottom: 2px solid var(--neon);
            margin-bottom: 20px;
        }

        .sidebar-header h3 {
            color: var(--neon);
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .filter-group { margin-bottom: 30px; }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px 25px;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            border-left: 4px solid transparent;
            position: relative;
        }

        .filter-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 0; height: 100%;
            background: rgba(250, 255, 0, 0.05);
            transition: width 0.3s ease;
        }

        .filter-item:hover::before { width: 100%; }

        .filter-item:hover,
        .filter-item.active {
            background: rgba(250, 255, 0, 0.08);
            color: var(--neon);
            border-left-color: var(--neon);
        }

        .filter-item i { font-size: 18px; }

        .sub-category { padding-left: 50px; font-size: 13px; }

        .coming-soon {
            font-size: 10px;
            color: #666;
            margin-left: 10px;
            font-weight: normal;
        }

        /* ==================== PRODUCT GRID ==================== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 25px;
        }

        @media (max-width: 1200px) { .products-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 992px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .section-title { font-size: 20px; letter-spacing: 3px; }
            .filter-header { gap: 10px; margin-bottom: 20px; }
        }

        /* ==================== PRODUCT CARD ==================== */
        .product-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
            animation: fadeInUp 0.6s ease-out;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: var(--neon);
            box-shadow: 0 10px 40px rgba(250, 255, 0, 0.3);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%;
            background: #111;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .img-wrapper { padding-top: 120%; }
        }

        .img-wrapper img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            cursor: zoom-in;
        }

        .img-wrapper img.active { opacity: 1; }
        .img-wrapper:hover img.active { transform: scale(1.1); }

        .stock-badge {
            position: absolute;
            top: 8px; right: 8px;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 8px;
            font-weight: bold;
            letter-spacing: 0.3px;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .stock-badge {
                padding: 2px 6px;
                font-size: 6px;
                top: 5px; right: 5px;
                border-radius: 8px;
            }
        }

        .stock-in { background: var(--neon); color: #000; }
        .stock-out { background: #ff0000; color: #fff; }

        .img-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 35px;
            height: 35px;
            background: rgba(250, 255, 0, 0.9);
            border: none;
            border-radius: 50%;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .img-nav { width: 25px; height: 25px; font-size: 12px; }
        }

        .img-wrapper:hover .img-nav { opacity: 1; }
        .img-nav:hover { background: var(--neon); transform: translateY(-50%) scale(1.1); }
        .img-nav.prev { left: 10px; }
        .img-nav.next { right: 10px; }

        @media (max-width: 768px) {
            .img-nav.prev { left: 5px; }
            .img-nav.next { right: 5px; }
        }

        .card-info { padding: 15px; }

        @media (max-width: 768px) {
            .card-info { padding: 10px; }
        }

        .name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .name { font-size: 13px; letter-spacing: 0.5px; margin-bottom: 5px; }
        }

        .product-desc {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-desc.expanded {
            -webkit-line-clamp: unset;
            display: block;
        }

        @media (max-width: 768px) {
            .product-desc {
                font-size: 10px;
                margin-bottom: 8px;
                line-height: 1.3;
                -webkit-line-clamp: 1;
            }
        }

        .read-more {
            color: var(--neon);
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            display: inline-block;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .read-more { font-size: 9px; margin-bottom: 5px; }
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: var(--neon);
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .price { font-size: 16px; margin-bottom: 10px; }
        }

        .shop-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: var(--neon);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .shop-btn {
                padding: 8px;
                font-size: 11px;
                gap: 5px;
                letter-spacing: 0.5px;
            }
        }

        .shop-btn:hover {
            background: #fff;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(250, 255, 0, 0.5);
        }

        /* ==================== MODAL ==================== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            backdrop-filter: blur(10px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
            border: 3px solid var(--neon);
        }

        .modal-close {
            position: absolute;
            top: -50px; right: 0;
            width: 40px; height: 40px;
            background: var(--neon);
            border: none;
            border-radius: 50%;
            color: #000;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover { transform: rotate(90deg) scale(1.1); }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px; height: 50px;
            background: var(--neon);
            border: none;
            border-radius: 50%;
            color: #000;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-nav:hover { transform: translateY(-50%) scale(1.1); }
        .modal-nav.prev { left: 20px; }
        .modal-nav.next { right: 20px; }

        /* ==================== EMPTY STATE ==================== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty-state i { font-size: 60px; margin-bottom: 20px; color: var(--neon); }
        .empty-state p { font-size: 18px; }

        /* ==================== LOADING ==================== */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--neon);
        }

        .loading i {
            font-size: 60px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ==================== FOOTER ==================== */
        footer {
            margin-top: 60px;
            padding: 40px 5%;
            border-top: 2px solid var(--neon);
            background: rgba(0,0,0,0.98);
            text-align: center;
        }

        .footer-logo {
            font-family: 'Anton', sans-serif;
            font-size: 28px;
            color: var(--neon);
            letter-spacing: 5px;
            margin-bottom: 15px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #999;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-links a:hover { color: var(--neon); }

        .footer-social {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .footer-copy {
            color: #444;
            font-size: 12px;
        }

        .footer-copy a { color: var(--neon); text-decoration: none; }
    </style>
</head>

    <!-- ===== HERO VIDEO ===== -->

    <!-- ===== SIDEBAR FILTER ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()" aria-hidden="true"></div>

                </div>

                </div>
                <div class="filter-item sub-category" data-filter="jacket" onclick="applyFilter('jacket', event)" role="button" tabindex="0">
                    <i class="fas fa-user-tie" aria-hidden="true"></i>
                    <span>JACKET</span>
                </div>
                <div class="filter-item sub-category" data-filter="tshirt" onclick="applyFilter('tshirt', event)" role="button" tabindex="0">
                    <i class="fas fa-tshirt" aria-hidden="true"></i>

                </div>

            <div class="filter-item" data-filter="female" role="button" tabindex="0">
                <i class="fas fa-venus" aria-hidden="true"></i>
                <span>FEMALE</span>
                <span class="coming-soon">COMING SOON</span>
            </div>
        </div>
    </nav>

    <!-- ===== PRODUCTS SECTION ===== -->
    <main class="filter-container">

                    <i class="fas fa-filter" aria-hidden="true"></i>

                <i class="fas fa-spinner" aria-hidden="true"></i>
                <p>Loading products...</p>
            </div>
        </div>
    </main>

    <!-- ===== IMAGE MODAL ===== -->
    <div class="modal" id="imageModal" role="dialog" aria-modal="true" aria-label="Product Image Viewer">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()" aria-label="Close Image">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
            <button class="modal-nav prev" id="modalPrev" aria-label="Previous Image">
                <i class="fas fa-chevron-left" aria-hidden="true"></i>
            </button>
            <img id="modalImg" src="" alt="Product Image" loading="lazy">
            <button class="modal-nav next" id="modalNext" aria-label="Next Image">
                <i class="fas fa-chevron-right" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="footer-logo">NOX &amp; WEAR</div>
        <nav class="footer-links" aria-label="Footer Navigation">
            <a href="https://wa.me/8801734511979" rel="noopener noreferrer" target="_blank">WhatsApp Order</a>
            <a href="https://www.facebook.com/profile.php?id=61576588238481" rel="noopener noreferrer" target="_blank">Facebook Page</a>
        </nav>
        <div class="footer-social">
            <a href="https://wa.me/8801734511979" class="social-btn" aria-label="WhatsApp" rel="noopener noreferrer" target="_blank">
                <i class="fab fa-whatsapp" aria-hidden="true"></i>
            </a>
            <a href="https://www.facebook.com/profile.php?id=61576588238481" class="social-btn" aria-label="Facebook" rel="noopener noreferrer" target="_blank">
                <i class="fab fa-facebook" aria-hidden="true"></i>
            </a>
        </div>
        <p class="footer-copy">&copy; 2025 <a href="#">Nox &amp; Wear</a>. All Rights Reserved. Made with ❤️ in Bangladesh.</p>
    </footer>

    <script>
        // ==================== CONFIGURATION ====================
        const CONFIG = {
            apiUrl: 'https://api.steinhq.com/v1/storages/698dfe18affba40a624cc890/products',
            whatsappNumber: '8801734511979',
            autoSwitchInterval: 4000
        };

        // ==================== STATE ====================
        let allProducts = [];
        let currentFilter = 'all';
        let modalImages = [];
        let modalCurrentIndex = 0;
        let autoSwitchIntervals = new Map();

        // ==================== SIDEBAR FUNCTIONS ====================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('show');
        }

        function toggleMaleSubcategories(event) {
            if (event) event.stopPropagation();
            const subcat = document.getElementById('maleSubcategories');
            subcat.style.display = subcat.style.display === 'none' ? 'block' : 'none';
        }

        // ==================== FILTER FUNCTIONS ====================
        function applyFilter(filter, event) {
            if (event) event.stopPropagation();

            currentFilter = filter;

            document.querySelectorAll('.filter-item').forEach(item => {
                item.classList.remove('active');
                item.setAttribute('aria-pressed', 'false');
            });

            const activeItem = document.querySelector(`[data-filter="${filter}"]`);
            if (activeItem) {
                activeItem.classList.add('active');
                activeItem.setAttribute('aria-pressed', 'true');
            }

            renderProducts();
            closeSidebar();
        }

        // ==================== FETCH PRODUCTS ====================
        async function fetchProducts() {
            try {
                const response = await fetch(CONFIG.apiUrl);
                if (!response.ok) throw new Error('Failed to fetch products');

                let products = await response.json();

                allProducts = products.map(product => {
                    if (product['category '] && !product.category) {
                        product.category = product['category '];
                    }
                    return product;
                });

                renderProducts();
            } catch (error) {
                console.error('Error fetching products:', error);
                document.getElementById('productsGrid').innerHTML = `
                    <div class="empty-state" role="alert">
                        <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
                        <p>Error loading products. Please try again later.</p>
                    </div>
                `;
            }
        }

        // ==================== RENDER PRODUCTS ====================
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            autoSwitchIntervals.forEach(interval => clearInterval(interval));
            autoSwitchIntervals.clear();

            let filtered = [];

            if (currentFilter === 'all') {
                filtered = allProducts;
            } else if (currentFilter === 'male') {
                filtered = allProducts.filter(p => {
                    const cat = (p.category || '').trim().toUpperCase();
                    return cat === 'ATTAR' || cat === 'PUNJABI' || cat === 'JACKET' || cat === 'T-SHIRT' || cat === 'TSHIRT';
                });
            } else {
                const filterCat = currentFilter.toUpperCase().replace(/[\s-]/g, '');
                filtered = allProducts.filter(p => {
                    const productCat = (p.category || '').trim().toUpperCase().replace(/[\s-]/g, '');
                    return productCat === filterCat;
                });
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" role="status">
                        <i class="fas fa-box-open" aria-hidden="true"></i>
                        <p>No products found in this category</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((product, index) => {
                const card = createProductCard(product);
                card.style.animationDelay = `${index * 0.1}s`;
                grid.appendChild(card);
            });
        }

        // ==================== CREATE PRODUCT CARD ====================
        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.setAttribute('role', 'listitem');
            card.setAttribute('itemscope', '');
            card.setAttribute('itemtype', 'https://schema.org/Product');

            const images = product.images
                ? product.images.split(',').map(img => img.trim()).filter(img => img)
                : ['https://via.placeholder.com/300x300?text=No+Image'];

            const isOutOfStock = product.stock_status &&
                product.stock_status.trim().toLowerCase() === 'out_of_stock';

            const cardId = `card-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            const descId = `desc-${cardId}`;

            const description = product.description || 'Exclusive Nox & Wear Quality.';
            const needsReadMore = description.length > 50;

            let imageHTML = '';
            images.forEach((img, index) => {
                imageHTML += `<img src="${img}" class="${index === 0 ? 'active' : ''}" alt="${(product.name || 'Product').replace(/"/g, '&quot;')} - Nox & Wear" data-index="${index}" loading="lazy" itemprop="image">`;
            });

            card.innerHTML = `
                <div class="img-wrapper" id="${cardId}" data-images='${JSON.stringify(images).replace(/'/g, "&#39;")}'>
                    <div class="stock-badge ${isOutOfStock ? 'stock-out' : 'stock-in'}" aria-label="${isOutOfStock ? 'Out of Stock' : 'In Stock'}">
                        ${isOutOfStock ? 'OUT' : 'IN STOCK'}
                    </div>
                    ${imageHTML}
                    ${images.length > 1 ? `
                        <button class="img-nav prev" onclick="changeImage(event, '${cardId}', -1)" aria-label="Previous Image">
                            <i class="fas fa-chevron-left" aria-hidden="true"></i>
                        </button>
                        <button class="img-nav next" onclick="changeImage(event, '${cardId}', 1)" aria-label="Next Image">
                            <i class="fas fa-chevron-right" aria-hidden="true"></i>
                        </button>
                    ` : ''}
                </div>
                <div class="card-info">
                    <div class="name" title="${(product.name || 'Unnamed Product').replace(/"/g, '&quot;')}" itemprop="name">${product.name || 'Unnamed Product'}</div>
                    <div class="product-desc" id="${descId}" itemprop="description">${description}</div>
                    ${needsReadMore ? `<div class="read-more" onclick="toggleDescription('${descId}')" role="button" tabindex="0">Read More</div>` : ''}
                    <div class="price" itemprop="offers" itemscope itemtype="https://schema.org/Offer">
                        <span itemprop="price" content="${product.price || '0'}">${product.price || '0'}</span> TK
                        <meta itemprop="priceCurrency" content="BDT">
                        <meta itemprop="availability" content="${isOutOfStock ? 'https://schema.org/OutOfStock' : 'https://schema.org/InStock'}">
                    </div>
                    <a href="https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent('🛒 Order: ' + (product.name || '') + ' - ' + (product.price || '0') + ' TK\nNox & Wear Shop')}"
                       class="shop-btn" target="_blank" rel="noopener noreferrer"
                       aria-label="Order ${product.name || 'product'} via WhatsApp"
                       ${isOutOfStock ? 'style="opacity:0.5;pointer-events:none;"' : ''}>
                        <i class="fab fa-whatsapp" aria-hidden="true"></i>
                        ${isOutOfStock ? 'OUT OF STOCK' : 'SHOP NOW'}
                    </a>
                </div>
            `;

            const imgElements = card.querySelectorAll('.img-wrapper img');
            imgElements.forEach(img => {
                img.addEventListener('click', () => openModal(images, parseInt(img.dataset.index)));
            });

            if (images.length > 1) {
                startAutoSwitch(cardId);
            }

            return card;
        }

        // ==================== TOGGLE DESCRIPTION ====================
        function toggleDescription(descId) {
            const descElement = document.getElementById(descId);
            const readMoreBtn = descElement.nextElementSibling;

            if (descElement.classList.contains('expanded')) {
                descElement.classList.remove('expanded');
                readMoreBtn.textContent = 'Read More';
            } else {
                descElement.classList.add('expanded');
                readMoreBtn.textContent = 'Read Less';
            }
        }

        // ==================== AUTO SWITCH IMAGES ====================
        function startAutoSwitch(cardId) {
            const interval = setInterval(() => {
                const wrapper = document.getElementById(cardId);
                if (!wrapper) {
                    clearInterval(interval);
                    autoSwitchIntervals.delete(cardId);
                    return;
                }

                const images = wrapper.querySelectorAll('img');
                let currentIndex = 0;

                images.forEach((img, index) => {
                    if (img.classList.contains('active')) currentIndex = index;
                });

                let newIndex = currentIndex + 1;
                if (newIndex >= images.length) newIndex = 0;

                images[currentIndex].classList.remove('active');
                images[newIndex].classList.add('active');
            }, CONFIG.autoSwitchInterval);

            autoSwitchIntervals.set(cardId, interval);
        }

        // ==================== MANUAL IMAGE CHANGE ====================
        function changeImage(event, cardId, direction) {
            event.stopPropagation();

            const wrapper = document.getElementById(cardId);
            if (!wrapper) return;

            const images = wrapper.querySelectorAll('img');
            let currentIndex = 0;

            images.forEach((img, index) => {
                if (img.classList.contains('active')) currentIndex = index;
            });

            let newIndex = currentIndex + direction;
            if (newIndex < 0) newIndex = images.length - 1;
            if (newIndex >= images.length) newIndex = 0;

            images[currentIndex].classList.remove('active');
            images[newIndex].classList.add('active');

            const interval = autoSwitchIntervals.get(cardId);
            if (interval) {
                clearInterval(interval);
                startAutoSwitch(cardId);
            }
        }

        // ==================== MODAL FUNCTIONS ====================
        function openModal(images, startIndex = 0) {
            modalImages = images;
            modalCurrentIndex = startIndex;

            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');

            modalImg.src = images[startIndex];
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';

            updateModalButtons();
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }

        function changeModalImage(direction) {
            modalCurrentIndex += direction;
            if (modalCurrentIndex < 0) modalCurrentIndex = modalImages.length - 1;
            if (modalCurrentIndex >= modalImages.length) modalCurrentIndex = 0;

            document.getElementById('modalImg').src = modalImages[modalCurrentIndex];
            updateModalButtons();
        }

        function updateModalButtons() {
            const prevBtn = document.getElementById('modalPrev');
            const nextBtn = document.getElementById('modalNext');
            prevBtn.disabled = modalImages.length <= 1;
            nextBtn.disabled = modalImages.length <= 1;
        }

        // ==================== EVENT LISTENERS ====================
        document.getElementById('modalPrev').addEventListener('click', () => changeModalImage(-1));
        document.getElementById('modalNext').addEventListener('click', () => changeModalImage(1));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft' && document.getElementById('imageModal').classList.contains('show')) {
                changeModalImage(-1);
            }
            if (e.key === 'ArrowRight' && document.getElementById('imageModal').classList.contains('show')) {
                changeModalImage(1);
            }
        });

        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target.id === 'imageModal') closeModal();
        });

        // Keyboard support for filter items
        document.querySelectorAll('.filter-item[role="button"]').forEach(item => {
            item.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    item.click();
                }
            });
        });

        // ==================== INITIALIZE ====================
        fetchProducts();
    </script>
</body>
</html>
